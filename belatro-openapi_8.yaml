    delete:
      summary: "DELETE matches/{id}"
      operationId: "deleteMatch"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
    get:
      summary: "GET matches/{id}"
      operationId: "getMatch"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MatchDTO"
  /matches:
    post:
      summary: "POST matches"
      operationId: "createMatch"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MatchDTO"
    get:
      summary: "GET matches"
      operationId: "getAllMatches"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
