          schema:
            type: "integer"
            format: "int32"
            default: "20"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerMatchSummaryDTO"
  /lobbies:
    put:
      summary: "PUT lobbies"
      operationId: "updateLobby"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LobbyDTO"
    post:
      summary: "POST lobbies"
      operationId: "createLobby"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LobbyDTO"
        required: true
