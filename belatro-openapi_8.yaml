              schema:
                $ref: "#/components/schemas/Friendship"
  /friendship/{id}/cancel:
    post:
      summary: "POST friendship/{id}/cancel"
      operationId: "cancelFriendship"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Friendship"
  /friendship/{id}:
    delete:
      summary: "DELETE friendship/{id}"
      operationId: "deleteFriendship"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
    get:
      summary: "GET friendship/{id}"
      operationId: "getFriendshipById"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Friendship"
  /friendship/getAllFriendships:
    get:
      summary: "GET friendship/getAllFriendships"
      operationId: "getAllFriendships"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Friendship"
  /friendship/getAllByUserId/{userId}:
    get:
      summary: "GET friendship/getAllByUserId/{userId}"
      operationId: "getFriendshipsByUser"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Friendship"
  /api/auth/login:
    post:
      summary: "POST api/auth/login"
      operationId: "login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponseDTO"
  /api/auth/signup:
    post:
      summary: "POST api/auth/signup"
      operationId: "signup"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequestDTO"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponseDTO"
  /api/auth/logout:
    post:
      summary: "POST api/auth/logout"
      operationId: "logout"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "string"
  /api/cards/{cardKey}/image:
    get:
      summary: "GET api/cards/{cardKey}/image"
      operationId: "getCardImage"
      parameters:
        - name: "cardKey"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  type: "string"
                  format: "byte"
  /ranked/queue:
    post:
      summary: "POST ranked/queue"
      operationId: "join"
      responses:
        "200":
          description: "OK"
    delete:
      summary: "DELETE ranked/queue"
      operationId: "leave"
      responses:
        "200":
          description: "OK"
  /admin/user/{id}:
    delete:
      summary: "DELETE admin/user/{id}"
      operationId: "forgetUser"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /admin/users:
    get:
      summary: "GET admin/users"
      operationId: "listUsers"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserDto"
components:
  schemas:
    UserUpdateDTO:
      type: "object"
      properties:
        username:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        passwordHashed:
          type: "string"
          nullable: true
        eloRating:
          type: "integer"
          format: "int32"
          nullable: true
        level:
          type: "integer"
          format: "int32"
          nullable: true
        expPoints:
          type: "integer"
          format: "int32"
          nullable: true
        lastLogin:
          type: "string"
          format: "date-time"
          nullable: true
        gamesPlayed:
          type: "integer"
          format: "int32"
          nullable: true
    User:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        username:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        passwordHashed:
          type: "string"
          nullable: true
        eloRating:
          type: "integer"
          format: "int32"
          nullable: true
        level:
          type: "integer"
          format: "int32"
          nullable: true
        expPoints:
          type: "integer"
          format: "int32"
          nullable: true
        lastLogin:
          type: "string"
          format: "date-time"
          nullable: true
        gamesPlayed:
          type: "integer"
          format: "int32"
          nullable: true
        roles:
          type: "array"
          nullable: true
          items:
            type: "string"
            enum:
              - "ROLE_USER"
              - "ROLE_ADMIN"
          uniqueItems: true
        deletionRequested:
          type: "boolean"
          nullable: true
    Void:
      type: "object"
      properties: { }
    UserSimpleDTO:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        username:
          type: "string"
          nullable: true
    LobbyDTO:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        name:
          type: "string"
          nullable: true
        gameMode:
          type: "string"
          nullable: true
        status:
          type: "string"
          nullable: true
          enum:
            - "WAITING"
            - "CLOSED"
        createdAt:
          type: "string"
          format: "date-time"
          nullable: true
        hostUser:
          nullable: true
          $ref: "#/components/schemas/UserSimpleDTO"
        teamAPlayers:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/UserSimpleDTO"
        teamBPlayers:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/UserSimpleDTO"
        unassignedPlayers:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/UserSimpleDTO"
        privateLobby:
          type: "boolean"
          nullable: true
        password:
          type: "string"
          nullable: true
    MatchDTO:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        teamA:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/UserSimpleDTO"
        teamB:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/UserSimpleDTO"
        originLobby:
          nullable: true
          $ref: "#/components/schemas/LobbyDTO"
        gameMode:
          type: "string"
          nullable: true
          enum:
            - "CASUAL"
            - "RANKED"
        result:
          type: "string"
          nullable: true
        startTime:
          type: "string"
          format: "date-time"
          nullable: true
        endTime:
          type: "string"
          format: "date-time"
          nullable: true
    MoveDTO:
      type: "object"
      properties:
        order:
          type: "integer"
          format: "int32"
          nullable: true
        player:
          type: "string"
          nullable: true
        card:
          type: "string"
          nullable: true
    TrumpCallDTO:
      type: "object"
      properties:
        order:
          type: "integer"
          format: "int32"
          nullable: true
        player:
          type: "string"
          nullable: true
        trump:
          type: "string"
          nullable: true
    TrickDTO:
      type: "object"
      properties:
        trickNo:
          type: "integer"
          format: "int32"
          nullable: true
        moves:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/MoveDTO"
    ChallengeDTO:
      type: "object"
      properties:
        order:
          type: "integer"
          format: "int32"
          nullable: true
        player:
          type: "string"
          nullable: true
        success:
          type: "boolean"
          nullable: true
    HandDTO:
      type: "object"
      properties:
        handNo:
          type: "integer"
          format: "int32"
          nullable: true
        trumpCalls:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/TrumpCallDTO"
        tricks:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/TrickDTO"
        challenges:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/ChallengeDTO"
    MatchHistoryDTO:
      type: "object"
      properties:
        match:
          nullable: true
          $ref: "#/components/schemas/MatchDTO"
        moves:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/MoveDTO"
        structuredMoves:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/HandDTO"
    PlayerMatchHistoryDTO:
      type: "object"
      properties:
        history:
          nullable: true
          $ref: "#/components/schemas/MatchHistoryDTO"
        yourResult:
          type: "string"
          nullable: true
    Instant:
      type: "object"
      properties: { }
    PlayerMatchSummaryDTO:
      type: "object"
      properties:
        matchId:
          type: "string"
          nullable: true
        endTime:
          nullable: true
          $ref: "#/components/schemas/Instant"
        result:
          type: "string"
          nullable: true
        yourOutcome:
          type: "string"
          nullable: true
        gameMode:
          type: "string"
          nullable: true
          enum:
            - "CASUAL"
            - "RANKED"
    KickPlayerRequestDTO:
      type: "object"
      properties:
        lobbyId:
          type: "string"
          nullable: true
        usernameToKick:
          type: "string"
          nullable: true
        requesterUsername:
          type: "string"
          nullable: true
    LeaveLobbyRequestDTO:
      type: "object"
      properties:
        id:
          type: "string"
          nullable: true
        username:
          type: "string"
          nullable: true
    JoinLobbyRequestDTO:
      type: "object"
      properties:
        lobbyId:
          type: "string"
          nullable: true
        userId:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
    TeamSwitchRequestDTO:
      type: "object"
      properties:
        lobbyId:
          type: "string"
