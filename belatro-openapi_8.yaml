            '*/*':
              schema:
                $ref: "#/components/schemas/Friendship"
  /friendship/{id}/accept:
    post:
      summary: "POST friendship/{id}/accept"
      operationId: "acceptFriendship"
      parameters:
        - name: "id"
          in: "path"
          required: true
