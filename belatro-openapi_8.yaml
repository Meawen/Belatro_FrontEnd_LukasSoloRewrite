  /matches/getmatchbylobbyid/{lobbyId}:
    get:
      summary: "GET matches/getmatchbylobbyid/{lobbyId}"
      operationId: "getMatchByLobbyId"
      parameters:
        - name: "lobbyId"
          in: "path"
